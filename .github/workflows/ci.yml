name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tjuvstart/web exec playwright install --with-deps chromium
      - run: pnpm e2e

  content:
    name: Content (.NET validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tools/ContentCli/ContentCli.slnx
      - name: Validate content
        run: dotnet run --project tools/ContentCli/src/Tjuvstart.ContentCli -- validate content
      - name: Python tests (audio build)
        run: python3 -m unittest discover -s tools/audio
      - name: Coverage report
        run: dotnet run --project tools/ContentCli/src/Tjuvstart.ContentCli -- coverage content --summary "$GITHUB_STEP_SUMMARY"

  api:
    name: Sync API (.NET build, format, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build services/SyncApi/SyncApi.slnx
      - run: dotnet format services/SyncApi/SyncApi.slnx --verify-no-changes --no-restore
      - run: dotnet test services/SyncApi/SyncApi.slnx --no-build

  audio:
    name: Audio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/generate-audio
        with:
          azure-key: ${{ secrets.AZURE_SPEECH_KEY }}
          azure-region: ${{ vars.AZURE_SPEECH_REGION }}
      - name: Check every text has audio
        run: |
          texts=$(python3 -c "import json; print(len(json.load(open('.voices/speech.json'))))")
          files=$(ls apps/web/public/audio/*.mp3 | wc -l)
          echo "$texts texts, $files audio files"
          test "$texts" -eq "$files"
