name: iOS

# The iOS app wraps the web build (docs/native.md). This checks that the native project still
# compiles, without signing, whenever something it depends on changes.
on:
  push:
    branches: [main]
    paths:
      - apps/web/ios/**
      - apps/web/capacitor.config.ts
      - apps/web/package.json
      - pnpm-lock.yaml
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - apps/web/ios/**
      - apps/web/capacitor.config.ts
      - apps/web/package.json
      - pnpm-lock.yaml
      - .github/workflows/ios.yml

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS (simulator build, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app and copy it into the iOS project
        run: pnpm --filter @tjuvstart/web ios:sync
      - name: Check the committed native project matches the plugins
        run: git diff --exit-code -- apps/web/ios
      - name: Build for the simulator
        working-directory: apps/web/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
